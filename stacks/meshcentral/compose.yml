# MeshCentral — remote management for school PCs (agents), MongoDB backend.
# TLS is terminated by the reverse proxy; MeshCentral runs in TLS-offload mode.
# Values come from ./.env (rendered): TZ MGMT_IP MESH_HOSTNAME TRUSTED_PROXY REVPROXY_IP MONGO_USERNAME MONGO_PASSWORD
#
# First run only: set ALLOW_NEW_ACCOUNTS to "true", create the admin account (first account = site admin),
# then set it back to "false" and `docker compose up -d`.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  mongodb:
    image: mongo:7
    container_name: meshcentral_mongodb
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: meshcentral
      TZ: ${TZ}
    volumes:
      - ./data/mongodb:/data/db
    networks: [mesh]
    restart: unless-stopped
    logging: *logging

  meshcentral:
    # Pinned to the version running at LRES (1.2.6). Check the tag exists on ghcr before first pull.
    image: ghcr.io/ylianst/meshcentral:1.2.6-mongodb
    container_name: meshcentral
    depends_on: [mongodb]
    environment:
      HOSTNAME: ${MESH_HOSTNAME}
      USE_MONGODB: "true"
      MONGO_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/meshcentral?authSource=admin
      TLS_OFFLOAD: ${REVPROXY_IP}
      DYNAMIC_CONFIG: "true"
      TRUSTED_PROXY: ${TRUSTED_PROXY}
      REVERSE_PROXY: ${MESH_HOSTNAME}
      REVERSE_PROXY_TLS_PORT: "443"
      ALLOW_NEW_ACCOUNTS: "false"
      IFRAME: "false"
      WEBRTC: "false"
      TZ: ${TZ}
    volumes:
      - ./data/meshcentral-data:/opt/meshcentral/meshcentral-data       # certs + config (back this up)
      - ./data/meshcentral-files:/opt/meshcentral/meshcentral-files
      - ./data/meshcentral-web:/opt/meshcentral/meshcentral-web
      - ./data/meshcentral-backups:/opt/meshcentral/meshcentral-backups
    ports:
      - "${MGMT_IP}:8443:443"
    networks: [mesh]
    restart: unless-stopped
    logging: *logging

networks:
  mesh:
    driver: bridge
